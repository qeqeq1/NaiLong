<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群组 JSON 录入工具</title><style>
*{box-sizing:border-box}body{font:15px system-ui,"Microsoft YaHei",sans-serif;background:#f6f6f2;color:#282920;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e5e4dc;border-radius:14px;padding:18px;margin:14px 0}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;margin-bottom:5px;color:#666}input,select,textarea{width:100%;padding:10px;border:1px solid #d9d9d1;border-radius:8px;font:inherit;margin-bottom:12px}button,.pick{border:0;background:#f4d65e;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:650;margin:3px}.secondary{background:#eeeee8}.danger{background:#f3dada}.list{display:flex;flex-direction:column;gap:7px;max-height:65vh;overflow:auto}.item{width:100%;text-align:left;background:#f8f8f4;border:1px solid #e5e4dc;line-height:1.5}.hint{color:#666;font-size:13px;line-height:1.7}.wide{grid-column:1/-1}@media(max-width:720px){.layout,.row{grid-template-columns:1fr}.list{max-height:250px}.wrap{padding:12px}}
</style></head><body><div class="wrap"><h1>群组信息录入 / 修改工具</h1><p class="hint">纯本地工具，不会自动上传数据。导入正式 JSON，编辑后导出，再将文件提交到 GitHub。不要在此页面输入 GitHub Token。</p><div class="panel"><label>导入现有 groups.json</label><input id="file" type="file" accept=".json,application/json"><button id="new">＋ 新增群组</button><button id="export">导出 groups.json</button><span id="msg" class="hint"></span></div><div class="layout"><section class="panel"><h2>群组列表 <span id="count"></span></h2><input id="filter" placeholder="筛选学校、群名、群号"><div id="list" class="list"></div></section><section class="panel"><h2>编辑群组</h2><form id="form"><div class="row"><div><label>唯一 ID *</label><input id="id" required placeholder="njust-001"></div><div><label>学校 / 组织 *</label><input id="school" required></div><div><label>群组名称 *</label><input id="name" required></div><div><label>QQ 群号 *</label><input id="qq" required pattern="[0-9]{5,12}" inputmode="numeric"></div><div><label>群组类型</label><select id="type"><option>奶龙</option><option>奶蛙</option><option>联合会</option><option>其他</option></select></div><div><label>状态</label><select id="status"><option value="active">正常收录</option><option value="paused">暂停加入</option><option value="dissolved">已解散</option><option value="pending">待核验</option></select></div><div class="wide"><label>学校别名（逗号分隔）</label><input id="aliases" placeholder="南理工,NJUST"></div><div class="wide"><label>简介</label><textarea id="intro" rows="3"></textarea></div><div class="wide"><label>群规则</label><input id="rules" placeholder="例如：禁止奶蛙"></div><div class="wide"><label>加群链接（可选）</label><input id="joinUrl" type="url" placeholder="https://..."></div><div><label>核验日期</label><input id="verifiedAt" type="date"></div><div><label>最后更新日期 *</label><input id="updatedAt" type="date" required></div></div><button type="submit">保存到列表</button><button type="button" id="duplicate" class="secondary">复制为新记录</button><button type="button" id="delete" class="danger">删除记录</button></form></section></div></div>
<script>
const $=x=>document.getElementById(x);let data=[],selected=null;const keys=['id','school','name','qq','type','status','intro','rules','joinUrl','verifiedAt','updatedAt'];const today=()=>new Date().toISOString().slice(0,10);function blank(){return{id:'',school:'',schoolAliases:[],name:'',qq:'',type:'奶龙',intro:'',rules:'',joinUrl:'',status:'active',verifiedAt:'',updatedAt:today()}}function form(g){g=g||blank();selected=g.id||null;keys.forEach(k=>$(k).value=g[k]??'');$('aliases').value=(g.schoolAliases||[]).join(', ');render()}function read(){return{id:$('id').value.trim(),school:$('school').value.trim(),schoolAliases:$('aliases').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),name:$('name').value.trim(),qq:$('qq').value.trim(),type:$('type').value,intro:$('intro').value.trim(),rules:$('rules').value.trim(),joinUrl:$('joinUrl').value.trim(),status:$('status').value,verifiedAt:$('verifiedAt').value,updatedAt:$('updatedAt').value}}function render(){let q=$('filter').value.toLowerCase();$('count').textContent='('+data.length+')';$('list').innerHTML=data.filter(g=>[g.school,g.name,g.qq,g.id].join(' ').toLowerCase().includes(q)).map(g=>`<button class="item" data-id="${g.id.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><b>${g.name}</b><br>${g.school} · ${g.qq}</button>`).join('')||'<p class="hint">暂无记录</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>form(data.find(g=>g.id===b.dataset.id)))}$('form').onsubmit=e=>{e.preventDefault();let g=read();if(!/^\d{5,12}$/.test(g.qq))return alert('QQ 群号必须为 5～12 位数字');if(g.joinUrl&&!g.joinUrl.startsWith('https://'))return alert('加群链接必须使用 HTTPS');if(data.some(x=>x.id===g.id&&x.id!==selected))return alert('唯一 ID 已存在');let i=data.findIndex(x=>x.id===selected);if(i<0)data.push(g);else data[i]=g;selected=g.id;render();$('msg').textContent='已保存到当前列表，请导出 JSON。'};$('new').onclick=()=>form(null);$('filter').oninput=render;$('delete').onclick=()=>{if(!selected)return alert('请先选择已有记录');if(!confirm('确定删除？'))return;data=data.filter(x=>x.id!==selected);form(null)};$('duplicate').onclick=()=>{let g=read();g.id=g.id+'-copy';g.name+='（副本）';form(g)};$('export').onclick=()=>{let ids=new Set(),errors=[];data.forEach((g,i)=>{if(ids.has(g.id))errors.push('重复 ID：'+g.id);ids.add(g.id);if(!/^\d{5,12}$/.test(g.qq))errors.push('群号格式异常：'+g.qq)});if(errors.length&&!confirm(errors.join('\n')+'\n仍要导出吗？'))return;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));a.href=url;a.download='groups.json';a.click();URL.revokeObjectURL(url)};$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d))throw Error('JSON 顶层必须是数组');data=d;form(data[0]);$('msg').textContent='已导入 '+data.length+' 条'}catch(err){alert('导入失败：'+err.message)}};fetch('../public/data/groups.json').then(r=>r.json()).then(d=>{data=d;form(data[0])}).catch(()=>form(null));
</script></body></html>
